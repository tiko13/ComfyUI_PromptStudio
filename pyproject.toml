[project]
name = "ComfyUI_PromptStudio"
version = "1.1.1"
description = "A local, ChatGPT-like extension for iterative image creation and editing in ComfyUI with help from a local LLM"
readme = "README.md"
license = { text = "MIT License" }
# Installation range retained; only Python 3.14 is verified in the current local
# suite. See docs/release-checklist.md before claiming minimum-version support.
requires-python = ">=3.9"
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/tiko13/ComfyUI_PromptStudio"
Documentation = "https://github.com/tiko13/ComfyUI_PromptStudio#readme"
"Bug Tracker" = "https://github.com/tiko13/ComfyUI_PromptStudio/issues"

[tool.comfy]
PublisherId = "tiko13"
DisplayName = "ComfyUI_PromptStudio"
Icon = "https://raw.githubusercontent.com/tiko13/ComfyUI_PromptStudio/master/web/prompt-studio-icon.svg"
