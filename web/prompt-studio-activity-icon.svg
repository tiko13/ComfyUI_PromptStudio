<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="background" x1="28" y1="20" x2="226" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151722"/>
      <stop offset="1" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="mark" x1="49" y1="35" x2="202" y2="235" gradientUnits="userSpaceOnUse">
      <stop class="promptstudio-activity-start" stop-color="#795cff"/>
      <stop class="promptstudio-activity-middle" offset="0.52" stop-color="#9a7fff"/>
      <stop class="promptstudio-activity-end" offset="1" stop-color="#c1afff"/>
    </linearGradient>
  </defs>
  <style>
    .promptstudio-activity-start {
      animation: promptstudio-activity-start 1.8s ease-in-out infinite;
    }
    .promptstudio-activity-middle {
      animation: promptstudio-activity-middle 1.8s ease-in-out infinite;
    }
    .promptstudio-activity-end {
      animation: promptstudio-activity-end 1.8s ease-in-out infinite;
    }
    @keyframes promptstudio-activity-start {
      0%, 100% { stop-color: #795cff; }
      50% { stop-color: #ff334f; }
    }
    @keyframes promptstudio-activity-middle {
      0%, 100% { stop-color: #9a7fff; }
      50% { stop-color: #ff5a67; }
    }
    @keyframes promptstudio-activity-end {
      0%, 100% { stop-color: #c1afff; }
      50% { stop-color: #ff9a8b; }
    }
    @media (prefers-reduced-motion: reduce) {
      .promptstudio-activity-start,
      .promptstudio-activity-middle,
      .promptstudio-activity-end {
        animation: none;
      }
      .promptstudio-activity-start { stop-color: #ff334f; }
      .promptstudio-activity-middle { stop-color: #ff5a67; }
      .promptstudio-activity-end { stop-color: #ff9a8b; }
    }
  </style>
