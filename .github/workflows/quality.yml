name: Studio quality
on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ComfyUI_PromptStudio
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: |
          python -m pip install numpy Pillow av aiohttp
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          cd ComfyUI_PromptStudio
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Python suites
        run: |
          cd ComfyUI_PromptStudio
          python -B -m unittest discover -s tests
      - name: JavaScript and browser behavior
        working-directory: ComfyUI_PromptStudio
        run: |
          npm test
          npm run check:types
          npm run test:browser
      - name: Syntax and patch validation
        run: |
          find ComfyUI_PromptStudio/web -name '*.js' -exec node --check '{}' \;
          git -C ComfyUI_PromptStudio diff-tree --check HEAD
